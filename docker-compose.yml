name: webplanilla
services:
  postgres:
    image: postgres:16-alpine
    container_name: planilla-db
    environment:
      POSTGRES_USER: planilla
      POSTGRES_PASSWORD: planilla
      POSTGRES_DB: planilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: planilla-api
    environment:
      DATABASE_URL: postgresql://planilla:planilla@postgres:5432/planilla
      JWT_ACCESS_SECRET: cambia-este-secreto-access
      JWT_REFRESH_SECRET: cambia-este-secreto-refresh
      STORAGE_ROOT: /data/storage
      ADMIN_EMAIL: admin@padova.local
      ADMIN_PASSWORD: admin123
      CORS_ORIGIN: http://localhost:3010
      PORT: 3001
      COOKIE_SECURE: "false"
    volumes:
      - storage:/data/storage
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: planilla-web
    environment:
      API_URL: http://backend:3001
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
